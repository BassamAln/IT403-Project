<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAN Digital Store</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 0; }
        header { background-color: #2c3e50; color: #fff; padding: 20px; text-align: center; }
        .container { width: 80%; margin: 20px auto; }
        .product { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product h2 { color: #2980b9; }
        .price { font-size: 1.2em; font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to ZAN Digital Store</h1>
        <p>Your ultimate destination for digital setups and desktop assemblies.</p>
    </header>
    <div class="container">
        <div class="product">
            <h2>ZAN Pro Desktop Setup</h2>
            <p class="price">$49.99</p>
            <p>Complete digital layout for professional workstations.</p>
        </div>
        <div class="product">
            <h2>Streamer Starter Pack</h2>
            <p class="price">$29.99</p>
            <p>Everything you need to launch your streaming channel.</p>
        </div>
    </div>
</body>
</html>
